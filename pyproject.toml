[build-system]
requires = ["setuptools>=68,<75"]
build-backend = "setuptools.build_meta"

[project]
name = "karak-aqi-forecast"
version = "0.1.0"
description = "US EPA AQI forecasting pipeline for modeled Karak air quality"
requires-python = "==3.11.*"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
