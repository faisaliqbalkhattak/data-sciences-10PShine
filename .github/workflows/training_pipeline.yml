name: Training pipeline (daily)

# Trains models once daily at 00:00 UTC (night time in Pakistan).
# After training, commits model_eval.json to karAQI-data repo.
# Data artifacts are stored in karAQI-data, not the main karAQI repo.
on:
  schedule:
    - cron: "00 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-register:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install training pipeline dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-training.txt

      - name: Fetch raw Open-Meteo data (keyless)
        run: python -m src.build_features --fetch

      - name: Backfill feature store
        run: |
          python -m src.feature_store backfill-hourly --replace
          python -m src.feature_store backfill-daily --replace

      - name: Train daily models from the feature store
        run: python -m src.train --store

      - name: Train hourly models from the feature store
        run: python -m src.train_hourly --store

      - name: Register models in MLflow registry
        run: |
          python -m src.model_registry register-hourly
          python -m src.model_registry register-daily

      - name: Inspect registered models
        run: python -m src.model_registry list

      - name: Export model evaluation and SHAP as static JSON
        run: python -m src.export_eval

      - name: Upload model registry and manifests
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-registry
          path: |
            models/mlruns/
            models/aqi_forecast_models.json
            models/aqi_forecast_hourly_models.json
            data/processed/model_comparison.csv
            data/processed/hourly_model_comparison.csv
            data/processed/hourly_rolling_origin_comparison.csv
            data/processed/training_frame.csv
            data/processed/training_frame_hourly.csv
          if-no-files-found: error

      - name: Push model_eval.json to karAQI-data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ ! -f data/model_eval.json ]; then
            echo "No model_eval.json generated"
            exit 0
          fi
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "ERROR: DATA_REPO_TOKEN secret is not set. Cannot push to karAQI-data."
            echo "Set it at: https://github.com/faisaliqbalkhattak/karAQI/settings/secrets/actions"
            exit 1
          fi
          git clone https://oauth2:${DATA_REPO_TOKEN}@github.com/faisaliqbalkhattak/karAQI-data.git /tmp/karAQI-data || {
            echo "ERROR: Failed to clone karAQI-data repo. Check DATA_REPO_TOKEN permissions."
            exit 1
          }
          mkdir -p /tmp/karAQI-data/data
          cp data/model_eval.json /tmp/karAQI-data/data/
          cd /tmp/karAQI-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model_eval.json
          if git diff --cached --quiet; then
            echo "No changes to model eval JSON"
          else
            git commit -m "ci: refresh model evaluation JSON [skip ci]"
            git push
          fi
