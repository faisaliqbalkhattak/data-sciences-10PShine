name: Training pipeline (daily)

# Runs the training pipeline once a day per the assignment ("training pipeline
# runs daily for model updates"). It rebuilds the feature store from the latest
# keyless Open-Meteo data, trains both the daily and hourly models **from the
# feature store**, registers the accepted models in the MLflow registry
# (file-backed, no server), uploads the registry as a workflow artifact, and
# exports a fresh pre-computed forecast JSON for the dashboard.
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-register:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install training pipeline dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-training.txt

      - name: Fetch raw Open-Meteo data (keyless)
        run: python -m src.build_features --fetch

      - name: Backfill feature store
        run: |
          python -m src.feature_store backfill-hourly --replace
          python -m src.feature_store backfill-daily --replace

      - name: Train daily models from the feature store
        run: python -m src.train --store

      - name: Train hourly models from the feature store
        run: python -m src.train_hourly --store

      - name: Register models in MLflow registry
        run: |
          python -m src.model_registry register-hourly
          python -m src.model_registry register-daily

      - name: Inspect registered models
        run: python -m src.model_registry list

      - name: Export model evaluation and SHAP as static JSON
        run: python -m src.export_eval

      - name: Upload model registry and manifests
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-registry
          path: |
            models/mlruns/
            models/aqi_forecast_models.json
            models/aqi_forecast_hourly_models.json
            data/processed/model_comparison.csv
            data/processed/hourly_model_comparison.csv
            data/processed/hourly_rolling_origin_comparison.csv
            data/processed/training_frame.csv
            data/processed/training_frame_hourly.csv
          if-no-files-found: error

      - name: Commit model evaluation JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model_eval.json
          if git diff --cached --quiet; then
            echo "No changes to model eval JSON"
          else
            git commit -m "ci: refresh model evaluation JSON [skip ci]"
            git pull --rebase origin main
            git push
          fi
