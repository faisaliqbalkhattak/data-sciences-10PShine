name: IQAir fetch (daily)

# Fetches IQAir's hourly forecast for Karak ONCE PER DAY.
# IQAir rate-limits aggressively, so we only fetch once daily and store the
# result in karAQI-data. The dashboard and forecast pipeline read from this
# stored file — no runtime scraping, no rate limit issues.
#
# Runs at 05:00 UTC daily (after the forecast pipeline at :40).
# Also runs after training pipeline completes.

on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Training pipeline (daily)"]
    types: [completed]

permissions:
  contents: write

jobs:
  fetch-iqair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas requests python-dotenv

      - name: Fetch IQAir hourly forecast
        run: python -m src.fetch_iqair --force

      - name: Verify IQAir data
        run: |
          python -c "
          import json, sys
          try:
              with open('data/iqair_forecast.json') as f:
                  data = json.load(f)
              print(f'IQAir OK: {len(data)} hourly values')
              if len(data) == 0:
                  print('WARNING: No IQAir data fetched', file=sys.stderr)
          except FileNotFoundError:
              print('WARNING: iqair_forecast.json not created', file=sys.stderr)
          "

      - name: Push to karAQI-data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ ! -f data/iqair_forecast.json ]; then
            echo "No IQAir data to push"
            exit 0
          fi
          git clone https://oauth2:${DATA_REPO_TOKEN}@github.com/faisaliqbalkhattak/karAQI-data.git /tmp/karAQI-data 2>/dev/null || {
            echo "DATA_REPO_TOKEN not set or data repo not accessible — skipping push"
            exit 0
          }
          mkdir -p /tmp/karAQI-data/data
          cp data/iqair_forecast.json /tmp/karAQI-data/data/
          cd /tmp/karAQI-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/iqair_forecast.json
          if git diff --cached --quiet; then
            echo "No changes to IQAir forecast"
          else
            git commit -m "ci: refresh IQAir forecast [skip ci]"
            git push
          fi
