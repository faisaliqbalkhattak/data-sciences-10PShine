name: IQAir forecast fetch (hourly)

# Fetches IQAir's hourly forecast for Karak and commits it to the repo.
# IQAir rate-limits aggressively, so this runs as a separate workflow
# with its own schedule. The forecast pipeline and dashboard read from
# data/iqair_forecast.json instead of scraping at runtime.

on:
  schedule:
    - cron: "3 * * * *"    # 3 minutes after the feature pipeline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-iqair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: python -m pip install --upgrade pip pandas requests python-dotenv

      - name: Fetch IQAir hourly forecast
        run: python -m src.fetch_iqair

      - name: Verify IQAir file exists
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          p = Path('data/iqair_forecast.json')
          if not p.exists():
              print('WARNING: IQAir file not created', file=sys.stderr)
              sys.exit(0)  # don't fail the workflow on first run
          data = json.loads(p.read_text())
          print(f'IQAir OK: {len(data)} hourly values')
          "

      - name: Commit and push IQAir data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/iqair_forecast.json
          if git diff --cached --quiet; then
            echo "No changes to IQAir data"
          else
            git commit -m "ci: refresh IQAir forecast [skip ci]"
            git push
          fi
