name: Forecast pipeline (hourly)

# Generates the pre-computed forecast JSON that the Streamlit dashboard reads.
# Runs every hour, plus after training completes.
# Uses GITHUB_TOKEN with write permission to commit the JSON back to the repo.
#
# This workflow is SEPARATE from the feature pipeline (data fetching) and the
# training pipeline (model training) to keep concerns decoupled and avoid
# permission issues.

on:
  schedule:
    - cron: "5 * * * *"    # 5 minutes after the feature pipeline
  workflow_dispatch:
  workflow_run:
    workflows: ["Training pipeline (daily)"]
    types: [completed]

permissions:
  contents: write

jobs:
  generate-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run if the triggering workflow succeeded (for workflow_run) or always (for schedule/dispatch)
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Export pre-computed forecast (static JSON)
        run: python -m src.export_forecast --source live

      - name: Verify forecast file exists and is valid JSON
        run: |
          python -c "
          import json, sys
          with open('data/static_forecast.json') as f:
              data = json.load(f)
          n = len(data.get('outputs', []))
          iq = len(data.get('iqair_forecast', []))
          print(f'Forecast OK: {n} outputs, {iq} IQAir refs')
          if n != 30:
              print(f'ERROR: expected 30 outputs, got {n}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Commit and push forecast JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/static_forecast.json
          if git diff --cached --quiet; then
            echo "No changes to forecast JSON"
          else
            git commit -m "ci: refresh forecast JSON [skip ci]"
            git push
          fi
