name: Forecast pipeline (hourly)

# Generates the pre-computed forecast JSON and fetches IQAir reference data.
# Runs every hour at :40 (5 minutes after the feature pipeline at :35).
# Also triggered after the training pipeline completes.
# Commits both static_forecast.json and iqair_forecast.json to karAQI-data repo.
#
# IQAir is fetched directly inside export_forecast.py so both the model
# forecast and IQAir share the same timestamp and origin — no misalignment.

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Training pipeline (daily)"]
    types: [completed]

permissions:
  contents: write

jobs:
  generate-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install forecast pipeline dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-forecast.txt

      - name: Export pre-computed forecast (static JSON + IQAir)
        run: python -m src.export_forecast --source live

      - name: Verify forecast file exists and is valid JSON
        run: |
          python -c "
          import json, sys
          with open('data/static_forecast.json') as f:
              data = json.load(f)
          n = len(data.get('outputs', []))
          iq = len(data.get('iqair_forecast', []))
          print(f'Forecast OK: {n} outputs, {iq} IQAir refs')
          if n != 30:
              print(f'ERROR: expected 30 outputs, got {n}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Push JSONs to karAQI-data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git clone https://oauth2:${DATA_REPO_TOKEN}@github.com/faisaliqbalkhattak/karAQI-data.git /tmp/karAQI-data 2>/dev/null || {
            echo "DATA_REPO_TOKEN not set or data repo not accessible — skipping push"
            exit 0
          }
          mkdir -p /tmp/karAQI-data/data
          cp data/static_forecast.json /tmp/karAQI-data/data/
          cp data/iqair_forecast.json /tmp/karAQI-data/data/ 2>/dev/null || true
          cd /tmp/karAQI-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/static_forecast.json data/iqair_forecast.json
          if git diff --cached --quiet; then
            echo "No changes to forecast JSON"
          else
            git commit -m "ci: refresh forecast JSON [skip ci]"
            git push
          fi
