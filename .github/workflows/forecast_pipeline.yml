name: Forecast pipeline (hourly)

# Generates the pre-computed forecast JSON for the dashboard.
# Runs every hour at :05 (4 minutes after the feature pipeline at :01).
# Also triggered after the training pipeline completes.
# Commits static_forecast.json to karAQI-data repo.
#
# Reference AQI data comes from Open-Meteo (free, keyless, no rate limits).
# Our model predictions come from the trained Ridge model.

on:
  schedule:
    - cron: "05 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Training pipeline (daily)"]
    types: [completed]

permissions:
  contents: write

jobs:
  generate-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install forecast pipeline dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-forecast.txt

      - name: Export pre-computed forecast (static JSON)
        run: python -m src.export_forecast --source live

      - name: Verify forecast file exists and is valid JSON
        run: |
          python -c "
          import json, sys
          with open('data/static_forecast.json') as f:
              data = json.load(f)
          n = len(data.get('outputs', []))
          print(f'Forecast OK: {n} outputs')
          if n != 30:
              print(f'ERROR: expected 30 outputs, got {n}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Push forecast JSON to karAQI-data repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "ERROR: DATA_REPO_TOKEN secret is not set. Cannot push to karAQI-data."
            echo "Set it at: https://github.com/faisaliqbalkhattak/karAQI/settings/secrets/actions"
            exit 1
          fi
          git clone https://oauth2:${DATA_REPO_TOKEN}@github.com/faisaliqbalkhattak/karAQI-data.git /tmp/karAQI-data || {
            echo "ERROR: Failed to clone karAQI-data repo. Check DATA_REPO_TOKEN permissions."
            exit 1
          }
          mkdir -p /tmp/karAQI-data/data
          cp data/static_forecast.json /tmp/karAQI-data/data/
          cd /tmp/karAQI-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/static_forecast.json
          if git diff --cached --quiet; then
            echo "No changes to forecast JSON"
          else
            git commit -m "ci: refresh forecast JSON [skip ci]"
            git push
          fi
